name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Install Capacitor CLI and iOS
        run: |
          npm install -g @capacitor/cli@6
          npm install @capacitor/core@6 @capacitor/ios@6

      - name: Initialize Capacitor iOS project
        run: |
          rm -f capacitor.config.ts capacitor.config.json
          if [ -f ios/ExportOptions.plist ]; then
            cp ios/ExportOptions.plist /tmp/ExportOptions.plist.bak
          fi
          rm -rf ios
          npx cap init "All in One mods" "com.aiom.ios" --web-dir dist
          npx cap add ios
          npx cap copy ios
          npx cap sync ios
          mkdir -p ios
          if [ -f /tmp/ExportOptions.plist.bak ]; then
            cp /tmp/ExportOptions.plist.bak ios/ExportOptions.plist
          fi
          if [ -f ios/App/Podfile ]; then
            sed -i '' "s/platform :ios, .*/platform :ios, '14.0'/g" ios/App/Podfile
          fi

      - name: Build IPA with xcodebuild
        run: |
          cd ios/App
          pod repo update
          pod install
          mkdir -p build/output
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          if [ -f ../ExportOptions.plist ]; then
            xcodebuild -exportArchive -archivePath $PWD/build/App.xcarchive -exportOptionsPlist $PWD/../ExportOptions.plist -exportPath $PWD/build/output -allowProvisioningUpdates NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          elif [ -f ExportOptions.plist ]; then
            xcodebuild -exportArchive -archivePath $PWD/build/App.xcarchive -exportOptionsPlist $PWD/ExportOptions.plist -exportPath $PWD/build/output -allowProvisioningUpdates NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            echo "ExportOptions.plist not found" && exit 1
          fi
          ls -la build/output/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIOM-iOS-IPA
          path: ios/App/build/output/*.ipa
          if-no-files-found: error
