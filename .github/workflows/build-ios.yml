name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Install Capacitor CLI and iOS
        run: |
          npm install -g @capacitor/cli@6
          npm install @capacitor/core@6 @capacitor/ios@6

      - name: Initialize Capacitor iOS project
        run: |
          rm -f capacitor.config.ts capacitor.config.json
          if [ -f ios/ExportOptions.plist ]; then
            cp ios/ExportOptions.plist /tmp/ExportOptions.plist.bak
          fi
          rm -rf ios
          npx cap init "All in One mods" "com.aiom.ios" --web-dir dist
          npx cap add ios
          npx cap copy ios
          npx cap sync ios
          mkdir -p ios
          if [ -f /tmp/ExportOptions.plist.bak ]; then
            cp /tmp/ExportOptions.plist.bak ios/ExportOptions.plist
          fi
          if [ -f ios/App/Podfile ]; then
            sed -i '' "s/platform :ios, .*/platform :ios, '14.0'/g" ios/App/Podfile
          fi
          # Add app icons
          if [ -f icon.png ]; then
            mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
            cp icon.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
            for size in 20 29 40 58 60 76 80 87 120 152 167 180; do
              sips -z $size $size ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-${size}.png >/dev/null 2>&1 || true
            done
            cat > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json << 'EOF'
{
  "images" : [
    {"idiom" : "iphone","size" : "20x20","scale" : "2x","filename" : "AppIcon-40.png"},
    {"idiom" : "iphone","size" : "20x20","scale" : "3x","filename" : "AppIcon-60.png"},
    {"idiom" : "iphone","size" : "29x29","scale" : "2x","filename" : "AppIcon-58.png"},
    {"idiom" : "iphone","size" : "29x29","scale" : "3x","filename" : "AppIcon-87.png"},
    {"idiom" : "iphone","size" : "40x40","scale" : "2x","filename" : "AppIcon-80.png"},
    {"idiom" : "iphone","size" : "40x40","scale" : "3x","filename" : "AppIcon-120.png"},
    {"idiom" : "iphone","size" : "60x60","scale" : "2x","filename" : "AppIcon-120.png"},
    {"idiom" : "iphone","size" : "60x60","scale" : "3x","filename" : "AppIcon-180.png"},
    {"idiom" : "ipad","size" : "20x20","scale" : "1x","filename" : "AppIcon-20.png"},
    {"idiom" : "ipad","size" : "20x20","scale" : "2x","filename" : "AppIcon-40.png"},
    {"idiom" : "ipad","size" : "29x29","scale" : "1x","filename" : "AppIcon-29.png"},
    {"idiom" : "ipad","size" : "29x29","scale" : "2x","filename" : "AppIcon-58.png"},
    {"idiom" : "ipad","size" : "40x40","scale" : "1x","filename" : "AppIcon-40.png"},
    {"idiom" : "ipad","size" : "40x40","scale" : "2x","filename" : "AppIcon-80.png"},
    {"idiom" : "ipad","size" : "76x76","scale" : "1x","filename" : "AppIcon-76.png"},
    {"idiom" : "ipad","size" : "76x76","scale" : "2x","filename" : "AppIcon-152.png"},
    {"idiom" : "ipad","size" : "83.5x83.5","scale" : "2x","filename" : "AppIcon-167.png"},
    {"idiom" : "ios-marketing","size" : "1024x1024","scale" : "1x","filename" : "AppIcon-1024.png"}
  ],
  "info" : {"version" : 1, "author" : "xcode"}
}
EOF
            # Update Info.plist if exists
            if [ -f ios/App/App/Info.plist ]; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" ios/App/App/Info.plist 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" ios/App/App/Info.plist 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" ios/App/App/Info.plist 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" ios/App/App/Info.plist 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon" ios/App/App/Info.plist 2>/dev/null || true
            fi
          fi

      - name: Build IPA with xcodebuild
        run: |
          cd ios/App
          pod repo update
          pod install
          mkdir -p build/output
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          APP_PATH="$PWD/build/App.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App.app not found at $APP_PATH" && exit 1
          fi
          cd build/output
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r AIOM-iOS.ipa Payload
          rm -rf Payload
          ls -la $PWD/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIOM-iOS-IPA
          path: ios/App/build/output/*.ipa
          if-no-files-found: error
